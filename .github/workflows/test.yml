name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # 6 Nov: ubuntu-latest became 26.04, which Playwright 1.55 cannot install on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Set up speech model environment
        run: |
          python3 -m venv ${{ runner.home }}/.cache/bandwagon-asr/venv
          ${{ runner.home }}/.cache/bandwagon-asr/venv/bin/pip install --quiet faster-whisper
          # Pre-download the small model to avoid network delay in tests
          ${{ runner.home }}/.cache/bandwagon-asr/venv/bin/python -c "
          from faster_whisper import WhisperModel
          WhisperModel('small', device='cpu', compute_type='int8', cpu_threads=4)
          print('Model downloaded and cached')
          "
      - name: Verify speech model environment
        working-directory: tools/factory
        env:
          BW_ASR_PY: ${{ runner.home }}/.cache/bandwagon-asr/venv/bin/python
        run: python3 test_speech_model.py
      - name: Take factory unit tests
        working-directory: tools/factory
        env:
          BW_ASR_PY: ${{ runner.home }}/.cache/bandwagon-asr/venv/bin/python
        run: python3 -m unittest test_take_factory
