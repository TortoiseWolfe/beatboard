name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # 6 Nov: ubuntu-latest became 26.04, which Playwright 1.55 cannot install on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Take factory unit tests
        working-directory: tools/factory
        run: python3 -m unittest test_take_factory
