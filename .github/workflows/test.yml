name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # 6 Nov: ubuntu-latest became 26.04, which Playwright 1.55 cannot install on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Set up speech model environment
        run: |
          python3 -m venv "$HOME/.cache/bandwagon-asr/venv"
          # Pin the versions the speech check is known to work with: newer av releases
          # drop the metadata_errors argument that faster-whisper passes to av.open.
          "$HOME/.cache/bandwagon-asr/venv/bin/pip" install --quiet "faster-whisper==1.2.1" "av==18.1.0"
          "$HOME/.cache/bandwagon-asr/venv/bin/pip" freeze
          # Pre-download the small model to avoid network delay in tests
          "$HOME/.cache/bandwagon-asr/venv/bin/python" -c "
          from faster_whisper import WhisperModel
          WhisperModel('small', device='cpu', compute_type='int8', cpu_threads=4)
          print('Model downloaded and cached')
          "
          # env: values are not shell-expanded, so export the real path for later steps
          echo "BW_ASR_PY=$HOME/.cache/bandwagon-asr/venv/bin/python" >> "$GITHUB_ENV"
      - name: Verify speech model environment
        working-directory: tools/factory
        run: python3 test_speech_model.py
      - name: Take factory unit tests
        working-directory: tools/factory
        run: python3 -m unittest test_take_factory
      - name: Install ffmpeg for the sampler mix tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Sampler unit tests (pack builder, renderer, mixer, gate)
        run: python3 -m unittest discover -v -s tools/sampler
